<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Karaoke Grabber app icon (product spec §7): a purple-to-magenta tile,
       a white retro capsule microphone, a small down-arrow underneath.
       Flat, no text. Rendered to assets/icon.icns by assets/make_icon.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E2385"/>
      <stop offset="0.55" stop-color="#8A2C8C"/>
      <stop offset="1" stop-color="#CC3478"/>
    </linearGradient>
  </defs>

  <!-- macOS tile: 824 px square on the 1024 grid, continuous-corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <!-- capsule head with grille slots -->
  <rect x="404" y="196" width="216" height="330" rx="108" fill="#FFFFFF"/>
  <g stroke="#8A2C8C" stroke-width="16" stroke-linecap="round" opacity="0.55">
    <line x1="446" y1="286" x2="578" y2="286"/>
    <line x1="440" y1="336" x2="584" y2="336"/>
    <line x1="440" y1="386" x2="584" y2="386"/>
    <line x1="446" y1="436" x2="578" y2="436"/>
  </g>

  <!-- U-shaped holder and stem -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 392 v34 a156 156 0 0 0 312 0 v-34"/>
    <line x1="512" y1="582" x2="512" y2="640"/>
  </g>

  <!-- the down-arrow: "grab it" -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <line x1="512" y1="690" x2="512" y2="820"/>
    <path d="M446 760 l66 66 l66 -66"/>
  </g>
</svg>
